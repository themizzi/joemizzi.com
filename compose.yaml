name: joemizzicom

services:
  dev:
    build:
      context: .devcontainer
      target: dev
      args:
        NODE_VERSION: "24.21.0"
        HUGO_VARIANT: hugo
        HUGO_VERSION: 0.165.0
    command: sleep infinity
    volumes:
      - .:/workspace:cached

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command: npx -y playwright@1.59.1 run-server --host 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const socket = require('net').connect(3000, '127.0.0.1'); socket.on('connect', () => socket.end(() => process.exit(0))); socket.on('error', () => process.exit(1));\""]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
